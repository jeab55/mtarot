name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash build.sh
      - uses: ncipollo/release-action@v1
        with: {tag: v1, artifacts: mtarot.apk, allowUpdates: true, token: ${{ secrets.GITHUB_TOKEN }}}
