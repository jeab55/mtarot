<script>
(function(){
  var API='https://mplus.thinkpowers.com/api.php';
  var mode='login', pend='';
  var g=function(i){return document.getElementById(i)};
  var _ht=(location.hash||'').match(/b55token=([a-f0-9]{16,})/);
  if(_ht){ try{history.replaceState(null,'',location.pathname+location.search);}catch(e){} localStorage.setItem('b55user',_ht[1]);localStorage.setItem('b55auth',_ht[1]);if(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Preferences)Capacitor.Plugins.Preferences.set({key:'b55token',value:_ht[1]}); var _ge=g('b55gate'); if(_ge)_ge.parentNode.removeChild(_ge); location.reload(); return; }
  function ui(){
    g('b55n').style.display = mode==='register'?'block':'none';
    g('b55c').style.display = mode==='verify'?'block':'none';
    g('b55e').style.display = mode==='verify'?'none':'block';
    g('b55p').style.display = mode==='verify'?'none':'block';
    g('b55b').textContent = mode==='login'?'เข้าสู่ระบบ':(mode==='register'?'สมัครสมาชิก':'ยืนยันรหัส');
    g('b55sw').textContent = mode==='login'?'สมัครสมาชิก':'กลับไปเข้าสู่ระบบ';
    g('b55gs').textContent = mode==='verify'?'เราส่งรหัส 6 หลักไปที่อีเมลของคุณแล้ว':(mode==='register'?'สร้างบัญชีใหม่ ใช้ได้กับทุกแอปของ base55':'ยังไม่มีบัญชี? กดสมัครด้านล่าง');
    g('b55err').textContent='';
    var rs=g('b55rs'); if(rs) rs.style.display = mode==='verify'?'block':'none';
  }
  function post(a,body){
    return fetch(API+'?a='+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){return r.json().then(function(d){if(!r.ok||d.ok===false)throw new Error(d.error||'เกิดข้อผิดพลาด');return d;});});
  }
  function done(t){localStorage.setItem('b55user',t);localStorage.setItem('b55auth',t);if(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Preferences)Capacitor.Plugins.Preferences.set({key:'b55token',value:t});var el=g('b55gate');if(el)el.parentNode.removeChild(el);location.reload();}
  g('b55b').onclick=function(){
    var e=g('b55e').value.trim(),p=g('b55p').value;
    if(mode==='register'){
      post('register',{email:e,password:p,name:g('b55n').value.trim()}).then(function(d){pend=d.email;mode='verify';ui();if(!d.mailSent)g('b55err').textContent='ส่งอีเมลไม่สำเร็จ — ติดต่อผู้ดูแล';})
        .catch(function(x){g('b55err').textContent=x.message;});
    } else if(mode==='verify'){
      post('verify',{email:pend||e,code:g('b55c').value.trim()}).then(function(d){done(d.token);})
        .catch(function(x){g('b55err').textContent=x.message;});
    } else {
      post('login',{email:e,password:p}).then(function(d){done(d.token);})
        .catch(function(x){if(x.message.indexOf('ยังไม่ยืนยัน')>-1){pend=e;mode='verify';ui();}g('b55err').textContent=x.message;});
    }
  };
  g('b55sw').onclick=function(){mode=(mode==='login'?'register':'login');ui();};
  var rsb=g('b55rsb'); if(rsb) rsb.onclick=function(){ if(!pend){g('b55err').textContent='กรอกอีเมลก่อน';return;} rsb.textContent='กำลังส่ง...'; post('resend',{email:pend}).then(function(d){ rsb.textContent='ส่งแล้ว ✓ เช็กอีเมล (ถ้าไม่เจอดูในโฟลเดอร์สแปม)'; }).catch(function(x){ rsb.textContent='ส่งรหัสอีกครั้ง'; g('b55err').textContent=x.message; }); };
  window.addEventListener('message',function(ev){
    if(ev.origin==='https://mplus.thinkpowers.com'&&ev.data&&ev.data.b55token)done(ev.data.b55token);
  });
  g('b55g').onclick=function(){var _u='https://mplus.thinkpowers.com/glogin.html?return='+encodeURIComponent(location.href.split('#')[0]); if(/Android|iPhone|iPad|iPod|Mobile|Line\//i.test(navigator.userAgent)){location.href=_u;}else{window.open(_u,'b55g','width=480,height=640');}};
  g('b55p').addEventListener('keydown',function(ev){if(ev.key==='Enter')g('b55b').click();});
  var t=localStorage.getItem('b55user');
  if(!t&&window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Preferences){Capacitor.Plugins.Preferences.get({key:'b55token'}).then(function(r){if(r&&r.value){localStorage.setItem('b55user',r.value);localStorage.setItem('b55auth',r.value);location.reload();}});}
  if(t){
    var _st=g('b55st'); if(_st)_st.textContent='\u0e01\u0e33\u0e25\u0e31\u0e07\u0e15\u0e23\u0e27\u0e08\u0e2a\u0e2d\u0e1a\u0e01\u0e32\u0e23\u0e40\u0e02\u0e49\u0e32\u0e2a\u0e39\u0e48\u0e23\u0e30\u0e1a\u0e1a\u2026';
    var _try=function(n){
      fetch(API+'?a=me',{headers:{'X-Auth':t}}).then(function(r){
        return r.json().then(function(d){return {status:r.status,ok:r.ok&&!!d&&d.ok===true};}).catch(function(){return {status:r.status,ok:false};});
      }).then(function(res){
        if(res.ok){var el=g('b55gate');if(el)el.parentNode.removeChild(el);}
        else if(res.status===401||res.status===403){localStorage.removeItem('b55user');localStorage.removeItem('b55auth');if(_st)_st.textContent='\u0e40\u0e0b\u0e2a\u0e0a\u0e31\u0e19\u0e2b\u0e21\u0e14\u0e2d\u0e32\u0e22\u0e38 \u0e01\u0e23\u0e38\u0e13\u0e32\u0e40\u0e02\u0e49\u0e32\u0e2a\u0e39\u0e48\u0e23\u0e30\u0e1a\u0e1a\u0e43\u0e2b\u0e21\u0e48';}
        else if(n>0){setTimeout(function(){_try(n-1);},1500);}
        else{var el=g('b55gate');if(el)el.parentNode.removeChild(el);}
      }).catch(function(){if(n>0){setTimeout(function(){_try(n-1);},1500);}else{var el=g('b55gate');if(el)el.parentNode.removeChild(el);}});
    };
    _try(1);
  }
})();
